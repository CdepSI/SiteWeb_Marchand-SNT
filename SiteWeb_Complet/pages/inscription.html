<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique SNT - Inscription</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/recherche.css">
    <link rel="stylesheet" href="/styles/inscription.css">
    <link rel="stylesheet" href="/styles/cookies.css">
</head>

<script src="js/recherche.js"></script>
<script src="js/inscription.js"></script>
<script src="js/menu.js"></script>
<script src="js/cookies.js"></script>

<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🛒 Boutique SNT</h1>
            <img src="../images/logo.png" alt="Logo Boutique SNT" style="height: 60px; width: auto;">
        </div>
        
        <div class="barre-recherche">
            <input type="text" 
                   id="input-recherche" 
                   placeholder="🔍 Rechercher un produit...">
            <button onclick="rechercher()">Rechercher</button>
            <button onclick="afficherIndex()">Voir l'index</button>
        </div>  

        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="main-nav">
            <a href="../index.html">Accueil</a>
            <a href="produits.html">Produits</a>
            <a href="panier.html">Panier 🛒</a>
            <a href="inscription.html">Inscription</a>
            <a href="plan.html">Plan du site</a>
        </nav>
    </header>

    <main>
        <h2>Inscription</h2>
        
        <div class="formulaire-conteneur">
            <form id="formulaire-inscription" onsubmit="inscrire(event)">
                <div class="champ-formulaire">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div class="champ-formulaire">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="champ-formulaire">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="champ-formulaire">
                    <label for="ville">Ville :</label>
                    <input type="text" id="ville" name="ville" required>
                </div>

                <div class="champ-formulaire">
                    <label for="age">Âge :</label>
                    <input type="number" id="age" name="age" min="1" max="120" required>
                </div>

                <button type="submit" class="button">S'inscrire</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <div class="liste-inscrits">
            <h3>Liste des inscrits</h3>
            <div id="clients-liste">
                <!-- La liste sera chargée ici -->
            </div>
        </div>

        <!-- Section des produits récemment consultés -->
        <div class="section-historique">
            <h2>🕒 Vous avez récemment consulté</h2>
            <div class="info-cookies">
                <p><em>Ces produits sont mémorisés dans un cookie sur votre navigateur</em></p>
                <button onclick="afficherCookies()" class="button-small">
                    Voir mes cookies 🍪
                </button>
                <button onclick="supprimerHistorique()" class="button-small button-danger">
                    Effacer l'historique
                </button>
            </div>
            <div id="historique-produits" class="produits-grid">
                <!-- Les produits récents seront affichés ici -->
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Boutique SNT - Projet pédagogique</p>
    </footer>
</body>
</html>
