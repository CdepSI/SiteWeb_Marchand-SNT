<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[TITRE DE LA PAGE]</title>
</head>

<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>[TITRE PRINCIPAL]</h1>
            <img src="../../images/logo.png" alt="Logo Boutique SNT" style="height: 60px; width: auto;">
        </div>

        <div class="barre-recherche">
            <input type="text"
                   id="input-recherche"
                   placeholder="🔍 Rechercher un produit...">
            <button onclick="rechercher()">Rechercher</button>
            <button onclick="afficherIndex()">Voir l'index</button>
        </div>

        <!-- AJOUTER LE MENU ICI -->

    </header>

    <main>
        <h2>[TITRE PRINCIPAL DE LA PAGE]</h2>
        <div id="resultats-recherche">
            <!-- Les résultats seront affichés ici -->
        </div>

        <!-- Section des produits récemment consultés -->
        <div class="section-historique">
            <h2>[TITRE SECTION HISTORIQUE]</h2>
            <div class="info-cookies">
                <p><em>[TEXTE INFO COOKIES]</em></p>
                <button onclick="afficherCookies()" class="button-small">
                    [TEXTE BOUTON COOKIES]
                </button>
                <button onclick="supprimerHistorique()" class="button-small button-danger">
                    [TEXTE BOUTON EFFACER]
                </button>
            </div>
            <div id="historique-produits" class="produits-grid">
                <!-- Les produits récents seront affichés ici -->
            </div>
        </div>
    </main>

    <footer>
        <p>[TEXTE DU FOOTER]</p>
    </footer>


</body>
</html>
